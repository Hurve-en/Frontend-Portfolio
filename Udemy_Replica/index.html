<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloso_udemy</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" href="assets/images/iACAD_logo.png" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="header-left">
          <a href="#" class="logo">udemy</a>
          <nav class="nav">
            <a href="#" class="nav-link">Explore</a>
            <a href="#" class="nav-link">Subscribe</a>
          </nav>
        </div>

        <div class="search-bar">
          <span class="search-icon">&#128269;</span>
          <input
            type="text"
            placeholder="Search for anything"
            class="search-input"
          />
        </div>

        <div class="header-right">
          <a href="#" class="nav-link hide-mobile">Udemy Business</a>
          <a href="#" class="nav-link hide-mobile">Teach on Udemy</a>
          <button class="icon-btn">&#128722;</button>
          <button class="btn btn-outline">Log in</button>
          <button class="btn btn-primary">Sign up</button>
        </div>
      </div>
    </header>

    <section class="topic-tags">
      <div class="container">
        <p class="topic-label">
          Recommended in <span class="topic-highlight">web development</span>
        </p>
        <div class="tags-row" id="topic-tags-list"></div>
      </div>
    </section>

    <section class="filter-bar">
      <div class="container filter-container">
        <div class="filters" id="filters-list"></div>
        <div class="sort">
          <select class="sort-select" id="sort-select" aria-label="Sort courses"></select>
        </div>
      </div>
    </section>

    <section class="course-grid">
      <div class="container">
        <h2 class="results-title">7 results for "web development"</h2>
        <div class="grid" id="course-grid-list"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-grid" id="footer-grid-list"></div>
        <div class="footer-bottom">
          <span class="footer-logo">udemy</span>
          <div class="footer-right"></div>
        </div>
      </div>
    </footer>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
