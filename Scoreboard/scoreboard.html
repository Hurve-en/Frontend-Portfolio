<!-- Simple comment: This file handles the page structure. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CW score board</title>
    <link rel="icon" href="iACAD_logo.png" />
    <!-- Modular CSS Files -->
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Event Scoreboard</h1>
          <div class="small" style="color: var(--muted); font-size: 12px">
            Add boxes, tap numbers to change, present mode for crowd
          </div>
        </div>

        <div class="controls">
          <button id="add-group" class="btn-primary">+ Add Group</button>
          <button id="reset-all" class="btn-ghost">Reset All</button>

          <!-- NEW toggle switch -->
          <button id="toggle-present" class="btn-ghost toggle-switch">
            <span class="label">Presentation: OFF</span>
            <span class="switch"></span>
          </button>
        </div>
      </header>

      <section id="board" aria-live="polite">
        <!-- dynamic groups inserted here -->
      </section>
    </main>

    <!-- Modular JavaScript Files (Load order matters!) -->
    <script src="assets/js/utils.js" defer></script>
    <script src="assets/js/state.js" defer></script>
    <script src="assets/js/ui.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
